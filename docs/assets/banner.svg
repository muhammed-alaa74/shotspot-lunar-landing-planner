<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">SHOTSPOT</title>
  <desc id="d">Miss-tolerant landing planner for the lunar south pole. Don't plan for a perfect landing. Plan for the miss.</desc>
  <defs>
    <radialGradient id="sky" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#16214a"/>
      <stop offset="0.55" stop-color="#090d24"/>
      <stop offset="1" stop-color="#02030a"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454b5c"/>
      <stop offset="0.35" stop-color="#232733"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8fb8ff"/>
    </linearGradient>
    <radialGradient id="earth" cx="35%" cy="35%" r="75%">
      <stop offset="0" stop-color="#7fd0ff"/>
      <stop offset="0.6" stop-color="#2468d8"/>
      <stop offset="1" stop-color="#0b2260"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <style>
    .tw { animation: tw 3.6s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
    .earth { animation: drift 9s ease-in-out infinite; }
    @keyframes drift { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-14px,10px) } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 3.2s ease-out infinite; }
    @keyframes ring { 0% { transform: scale(.15); opacity: .95 } 100% { transform: scale(1); opacity: 0 } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    .sun { animation: sun 7s ease-in-out infinite; }
    @keyframes sun { 0%,100% { opacity: .55 } 50% { opacity: .95 } }
    .sans { font-family: Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect width="1200" height="400" fill="url(#sky)"/>

  <g fill="#fff">
    <circle class="tw" cx="90" cy="48" r="1.4" style="animation-delay:0s"/>
    <circle class="tw" cx="210" cy="110" r="1" style="animation-delay:.8s"/>
    <circle class="tw" cx="330" cy="36" r="1.6" style="animation-delay:1.6s"/>
    <circle class="tw" cx="470" cy="84" r="1" style="animation-delay:2.2s"/>
    <circle class="tw" cx="560" cy="28" r="1.3" style="animation-delay:.4s"/>
    <circle class="tw" cx="690" cy="70" r="1" style="animation-delay:1.2s"/>
    <circle class="tw" cx="770" cy="30" r="1.5" style="animation-delay:2.8s"/>
    <circle class="tw" cx="880" cy="96" r="1" style="animation-delay:.2s"/>
    <circle class="tw" cx="1010" cy="44" r="1.4" style="animation-delay:1.9s"/>
    <circle class="tw" cx="1120" cy="120" r="1" style="animation-delay:2.5s"/>
    <circle class="tw" cx="1160" cy="40" r="1.2" style="animation-delay:.9s"/>
    <circle class="tw" cx="120" cy="200" r="1" style="animation-delay:3s"/>
    <circle class="tw" cx="640" cy="150" r="1" style="animation-delay:1.4s"/>
    <circle class="tw" cx="980" cy="190" r="1.2" style="animation-delay:2.1s"/>
    <circle class="tw" cx="40" cy="120" r="1.2" style="animation-delay:1s"/>
  </g>

  <!-- Earth, hovering over the horizon: the other half of the visibility story -->
  <g class="earth">
    <circle cx="1060" cy="92" r="26" fill="url(#earth)"/>
    <path d="M1046 84c6-6 12-4 16 1s-2 9-8 10-12-1-8-11z" fill="#3fae6a" opacity=".75"/>
  </g>

  <!-- Sunlight skimming the pole -->
  <ellipse class="sun" cx="930" cy="318" rx="260" ry="70" fill="url(#glow)"/>

  <!-- Lunar surface -->
  <circle cx="600" cy="1180" r="900" fill="url(#moon)"/>
  <circle cx="600" cy="1180" r="900" fill="none" stroke="#9fb4ff" stroke-opacity=".35" stroke-width="2"/>
  <g fill="#000" fill-opacity=".28">
    <ellipse cx="420" cy="372" rx="60" ry="9"/>
    <ellipse cx="610" cy="384" rx="90" ry="12"/>
    <ellipse cx="760" cy="362" rx="46" ry="7"/>
    <ellipse cx="1090" cy="372" rx="70" ry="10"/>
    <ellipse cx="250" cy="392" rx="80" ry="10"/>
  </g>

  <!-- Aim point with drift circle -->
  <g>
    <ellipse class="ring" cx="930" cy="344" rx="190" ry="26" fill="none" stroke="#5eead4" stroke-width="2" style="animation-delay:0s"/>
    <ellipse class="ring" cx="930" cy="344" rx="190" ry="26" fill="none" stroke="#5eead4" stroke-width="2" style="animation-delay:1.6s"/>
    <ellipse cx="930" cy="344" rx="190" ry="26" fill="#5eead4" fill-opacity=".06" stroke="#5eead4" stroke-opacity=".5" stroke-dasharray="6 6"/>
    <circle class="pulse" cx="930" cy="344" r="6" fill="#5eead4"/>
    <circle cx="930" cy="344" r="12" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.5"/>
    <path d="M930 322v14M930 352v14M908 344h14M938 344h14" stroke="#fff" stroke-opacity=".85" stroke-width="1.5"/>
  </g>

  <text class="sans" x="70" y="150" fill="url(#title)" font-size="88" font-weight="800" letter-spacing="6">SHOTSPOT</text>
  <text class="sans" x="74" y="204" fill="#e6ecff" font-size="30" font-weight="600">Don't plan for a perfect landing. Plan for the miss.</text>
  <text class="mono" x="74" y="248" fill="#8da2d8" font-size="17" letter-spacing="1">MISS-TOLERANT LANDING PLANNER · LUNAR SOUTH POLE</text>
  <text class="mono" x="74" y="276" fill="#5eead4" font-size="15" letter-spacing="1">real LOLA terrain · real Sun &amp; Earth geometry · runs offline</text>
</svg>
